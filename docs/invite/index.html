<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Date RSVP</title>
    <link rel="icon" id="pageIcon" type="image/png" href="../assets/spideyyy.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/invite.css">
    
    <script src="../js/invite.js" defer></script>
</head>
<body>

    <script>
        // Synchronous script to set theme IMMEDIATELY so invite.js triggers the right animations
        (function() {
            const p = new URLSearchParams(window.location.search);
            const m = p.get('m'); 
            
            if (m === 'Avengers: Doomsday') {
                document.body.classList.add('doomsday-theme');
            } else if (m === 'Insidious: Out of the Further') {
                document.body.classList.add('insidious-theme');
            }
        })();
    </script>

    <!-- AUDIO ELEMENTS -->
    <audio id="screamSound">
        <source src="../assets/effects/scream.mp3" type="audio/mpeg">
    </audio>
    <audio id="webSound">
        <source src="../assets/effects/web.mp3" type="audio/mpeg">
    </audio>
    <audio id="crackSound">
        <source src="../assets/effects/crack.mp3" type="audio/mpeg">
    </audio>
    
    <div id="emojiContainer" class="floating-emojis-container"></div>

    <div class="card" id="inviteCard" style="visibility: hidden;">
        <h1 id="inviteTitle"><br><em></em></h1>
        
        <div class="details">
            <p><strong>Movie:</strong> <span class="highlight" id="movieName"></span></p>
            <p id="dateLine"><strong>Date & Time:</strong> <span id="dateTime"></span></p>
            <p id="locLine"><strong>Location:</strong> <span id="locationPlace"></span> <br>
                <span id="mapToggleBtn" class="map-toggle highlight" style="display:none;">(View Map)</span>
            </p>
            
            <div id="countdownContainer" style="display: none; margin: 20px auto 0 auto; width: 100%; box-sizing: border-box; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px;">
                <span style="font-size: 0.9rem; opacity: 0.8; text-transform: uppercase; letter-spacing: 1px;">Time Remaining</span><br>
                <span id="countdownText" class="highlight" style="font-size: 1.3rem; font-weight: 600;"></span>
            </div>

            <div id="mapContainer" style="display: none; margin-top: 15px; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
                <iframe id="miniMap" width="100%" height="150" frameborder="0" style="border:0; display: block;" allowfullscreen="" aria-hidden="false" tabindex="0"></iframe>
            </div>
        </div>

        <div class="buttons">
            <button class="btn-yes" id="yesBtn">Yes</button>
            <button class="btn-no" id="noBtn">No</button>
        </div>
        
        <div id="cheekyText" style="display: none; margin-top: 20px; font-size: 0.95rem; font-style: italic; color: #f5f5f5; opacity: 0.9; animation: fadeIn 0.5s ease-out forwards;"></div>
    </div>

    <img src="../assets/wallpaper/web1.png" id="web1" class="web-shoot" alt="Web String">
    <img src="../assets/img/magic_effect.png" id="magic2" class="magic-circle-shoot-right" alt="Magic Circle 2">

    <div class="modal-overlay" id="successModal">
        <img src="../assets/wallpaper/web2.png" id="web2" class="web-splat" alt="Web Splat">
        
        <div id="blackout" class="blackout-screen"></div>
        <div id="tealFog" class="teal-fog"></div>
        <img src="../assets/img/cute_ghost.png" id="jumpscareImage" class="jumpscare-img" alt="Boo!">

        <div id="doomsdayFog" class="doomsday-fog"></div>
        <img src="../assets/img/cracks.png" id="doomsdayCrackImage" class="rift-image" alt="Reality Cracks">
        <img src="../assets/img/rift.png" id="doomsdayRiftImage" class="rift-image" alt="Reality Rift">

        <div class="modal-content">
            <div class="modal-title">It's a Date!</div>
            <img id="modalClientPic" src="" alt="Client Custom Picture" style="display: none;">
            <p id="modalMessage"></p>
        </div>
    </div>

    <!-- FIRESTORE FETCH SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBgBJP3T_-IX68jvkZiUhbpAT076CQAWAQ",
            authDomain: "inbyte-95cd5.firebaseapp.com",
            projectId: "inbyte-95cd5",
            storageBucket: "inbyte-95cd5.firebasestorage.app",
            messagingSenderId: "12505561820",
            appId: "1:12505561820:web:f54fdb68af65a52b1d9219",
            measurementId: "G-3JW84GNH49"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadInvite() {
            const params = new URLSearchParams(window.location.search);
            
            // --- LEGACY LINK SUPPORT ---
            if (params.has('invite')) {
                try {
                    // Decodes the old Base64/URL-encoded payload
                    const rawData = atob(decodeURIComponent(params.get('invite')));
                    const inviteData = JSON.parse(decodeURIComponent(rawData));
                    
                    if (window.initializeInvite) {
                        window.initializeInvite(inviteData);
                    }
                    return; // Stop here, do not query Firestore
                } catch (error) {
                    console.error("Error decoding old link:", error);
                }
            }
            // ---------------------------

            const inviteId = params.get('id');
            
            if (!inviteId) {
                document.body.innerHTML = "<h2 style='text-align:center; color:#fff; padding-top:20vh; font-family:sans-serif;'>Invalid Invite Link</h2>";
                document.body.style.visibility = 'visible';
                return;
            }

            try {
                const docRef = doc(db, "invites", inviteId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    
                    if (data.status === 'deactivated' || data.status === 'deleted') {
                        document.body.innerHTML = "<h2 style='text-align:center; color:#fff; padding-top:20vh; font-family:sans-serif;'>This invite is no longer available.</h2>";
                        document.body.style.visibility = 'visible';
                        return;
                    }
                    
                    if (window.initializeInvite) {
                        window.initializeInvite(data);
                    }
                    
                    if (!params.has('preview')) {
                        await updateDoc(docRef, { views: increment(1) });
                    }
                } else {
                    document.body.innerHTML = "<h2 style='text-align:center; color:#fff; padding-top:20vh; font-family:sans-serif;'>This invite does not exist.</h2>";
                    document.body.style.visibility = 'visible';
                }
            } catch (error) {
                console.error("Error fetching invite:", error);
                document.body.innerHTML = "<h2 style='text-align:center; color:#fff; padding-top:20vh; font-family:sans-serif;'>Error loading data.</h2>";
                document.body.style.visibility = 'visible';
            }
        }

        loadInvite();
    </script>
</body>
</html>
