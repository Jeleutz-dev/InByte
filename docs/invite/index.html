<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Date RSVP</title>
    <!-- Dynamic Favicon (Defaults to Spiderman) -->
    <link rel="icon" id="pageIcon" type="image/png" href="../assets/spideyyy.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/invite.css">
    
    <script src="../js/invite.js" defer></script>
</head>
<body>

    <!-- AUDIO ELEMENT FOR THE SCREAM FX -->
    <audio id="screamSound">
        <source src="../assets/effects/scream.mp3" type="audio/mpeg">
    </audio>

    <!-- NEW: Web shooter sound -->
    <audio id="webSound">
        <source src="../assets/effects/web.mp3" type="audio/mpeg">
    </audio>
    
    <!-- NEW: SPIDERMAN EMOJI CONTAINER -->
    <div id="emojiContainer" class="floating-emojis-container"></div>

    <div class="card">
        <h1 id="inviteTitle">  <br><em> </em></h1>
        <!-- <h1 id="inviteTitle">` <br><em>I bought tickets!</em></h1> -->
        
        <div class="details">
            <!-- <p><strong>Movie:</strong> <span class="highlight" id="movieName">Spiderman: Brand New Day</span></p> -->
            <p><strong>Movie:</strong> <span class="highlight" id="movieName"></span></p>
            <p id="dateLine"><strong>Date & Time:</strong> <span id="dateTime">July 31, 2026 @ 9:15 PM</span></p>
            <p id="locLine"><strong>Location:</strong> <span id="locationPlace">SM MOA ScreenX</span> <br>
                <span id="mapToggleBtn" class="map-toggle highlight">(View Map)</span>
            </p>
            
            <div id="countdownContainer" style="display: none; margin: 20px auto 0 auto; width: 100%; box-sizing: border-box; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px;">
                <span style="font-size: 0.9rem; opacity: 0.8; text-transform: uppercase; letter-spacing: 1px;">Time Remaining</span><br>
                <span id="countdownText" class="highlight" style="font-size: 1.3rem; font-weight: 600;"></span>
            </div>

            <div id="mapContainer" style="display: none; margin-top: 15px; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
                <iframe id="miniMap" width="100%" height="150" frameborder="0" style="border:0; display: block;" allowfullscreen="" aria-hidden="false" tabindex="0"></iframe>
            </div>
        </div>

        <div class="buttons">
            <button class="btn-yes" id="yesBtn">Yes</button>
            <button class="btn-no" id="noBtn">No</button>
        </div>
        
        <div id="cheekyText" style="display: none; margin-top: 20px; font-size: 0.95rem; font-style: italic; color: #f5f5f5; opacity: 0.9; animation: fadeIn 0.5s ease-out forwards;"></div>
    </div>

    <img src="../assets/wallpaper/web1.png" id="web1" class="web-shoot" alt="Web String">
    <img src="../assets/img/magic_effect.png" id="magic2" class="magic-circle-shoot-right" alt="Magic Circle 2">

    <div class="modal-overlay" id="successModal">
        <img src="../assets/wallpaper/web2.png" id="web2" class="web-splat" alt="Web Splat">
        
        <div id="blackout" class="blackout-screen"></div>
        <div id="tealFog" class="teal-fog"></div>
        <img src="../assets/img/cute_ghost.png" id="jumpscareImage" class="jumpscare-img" alt="Boo!">

        <div class="modal-content">
            <div class="modal-title">It's a Date!</div>
            
            <!-- NEW: Client Custom Image (Hidden by default) -->
            <img id="modalClientPic" src="" alt="Client Custom Picture" style="display: none;">
            
            <p id="modalMessage"></p>
        </div>
    </div>
    
</body>
</html>
