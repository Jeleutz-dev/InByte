<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invite Generator</title>
    <link rel="icon" id="pageIcon" type="image/png" href="../assets/inbyte-icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            
            /* --- PATH (../ goes up one folder to docs, then into assets) --- */
            background: #2a2a2a url('../assets/wallpaper/darkgenerator_bg.png') no-repeat center center fixed; 
            background-size: cover;
            /* --------------------------------------------- */
            
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
        }
        .container { 
            background: white; 
            padding: 2.5rem; 
            border-radius: 12px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.3); 
            max-width: 450px; 
            width: 100%; 
        }
        h2 { margin-top: 0; color: #1a1a1a; text-align: center; }
        label { font-weight: 500; display: block; margin-top: 1rem; font-size: 0.9rem; color: #555; }
        
        input[type="text"], input[type="date"], input[type="time"], textarea, select { 
            width: 100%; 
            padding: 10px; 
            margin-top: 5px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            font-family: inherit; 
            box-sizing: border-box;
            background-color: white;
        }
        
        .date-time-group {
            display: flex;
            gap: 10px;
        }
        
        .date-time-group input {
            flex: 1;
        }

        button { 
            margin-top: 1.5rem; 
            width: 100%; 
            padding: 12px; 
            background: #E23636; 
            color: white; 
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            font-weight: 500;
            font-size: 1.1rem;
            transition: transform 0.2s, background-color 0.2s;
        }
        button:hover { background: #C62828; transform: scale(1.02); }
        #resultBox { 
            margin-top: 1.5rem; 
            display: none; 
            background: #fcf9f2; 
            padding: 15px; 
            border-radius: 8px; 
            border: 1px solid #ddd;
        }
        #resultLink {
            display: block;
            margin-top: 10px;
            word-break: break-all;
            font-size: 0.85rem;
            color: #2B5292;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Create a Custom Invite</h2>
        
        <label>Invitee's Name</label>
        <input type="text" id="genName" placeholder="e.g., Erika">
        
        <label>Main Question (Optional)</label>
        <input type="text" id="genMainQ" placeholder="e.g., will you go on a movie date with me?">
        
        <label>Sub Text (Optional)</label>
        <input type="text" id="genSubQ" placeholder="e.g., I bought tickets!">
        
        <label>Movie Title</label>
        <select id="genMovie">
            <option value="Spiderman: Brand New Day">Spiderman: Brand New Day</option>
            <option value="Avengers: Doomsday">Avengers: Doomsday</option>
            <option value="Insidious: Out of the Further">Insidious: Out of the Further</option>
        </select>
        
        <label>Date & Time (Time is optional)</label>
        <div class="date-time-group">
            <input type="date" id="genDate">
            <input type="time" id="genTime">
        </div>
        
        <label>Location</label>
        <input type="text" id="genLoc" placeholder="e.g., SM MOA Director's Club">
        
        <label>Pop-up Success Message (Use &lt;br&gt; for new lines)</label>
        <textarea id="genMsg" rows="3" placeholder="Write your message here! use '<br>' to break to next line"></textarea>
        
        <div class="input-group">
            <label for="clientImage">Upload Custom Picture (Optional)</label>
            <input type="file" id="clientImage" accept="image/png, image/jpeg, image/gif">
            <p id="uploadStatus" style="font-size: 0.8rem; color: #888;"></p>
        </div>

        <button onclick="generateLink()">Generate Custom Link</button>
        
        <div id="resultBox">
            <strong>Here is your custom URL:</strong><br>
            <a href="#" id="resultLink" target="_blank"></a>
            <p style="font-size: 0.8rem; color: #666; margin-bottom: 0;">Copy this link and send it to your date!</p>
        </div>
    </div>

    <script>
        function generateLink() {
            // --- Date Formatting Logic ---
            let dateVal = document.getElementById('genDate').value;
            let timeVal = document.getElementById('genTime').value;
            let formattedDate = "";
            
            if (dateVal) {
                // Parse date safely to avoid timezone bugs
                let [year, month, day] = dateVal.split('-');
                let d = new Date(year, month - 1, day);
                let datePart = d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
                
                if (timeVal) {
                    // Convert 24h time to 12h AM/PM
                    let [hours, minutes] = timeVal.split(':');
                    let ampm = hours >= 12 ? 'PM' : 'AM';
                    let h = hours % 12;
                    h = h ? h : 12; // the hour '0' should be '12'
                    formattedDate = datePart + " @ " + h + ":" + minutes + " " + ampm;
                } else {
                    // No time provided, output just the date cleanly!
                    formattedDate = datePart; 
                }
            }

            // 1. Gather all inputs into a single object
            const inviteData = {
                name: document.getElementById('genName').value,
                movie: document.getElementById('genMovie').value,
                date: formattedDate,
                loc: document.getElementById('genLoc').value,
                msg: document.getElementById('genMsg').value,
                mainQ: document.getElementById('genMainQ').value,
                subQ: document.getElementById('genSubQ').value,
                
                // THE FIX: Inject the uploaded image URL right here!
                img: uploadedImageUrl 
            };

            // 2. Clean out any empty values so the link doesn't get unnecessarily long
            Object.keys(inviteData).forEach(key => {
                if (!inviteData[key]) delete inviteData[key];
            });

            // 3. Convert object to a string, make URL safe, and scramble (Base64 Encode)
            const encodedString = encodeURIComponent(btoa(encodeURIComponent(JSON.stringify(inviteData))));

            // 4. Build the final URL
            let baseUrl = 'https://jeleutz-dev.github.io/InByte/invite/';
            const finalUrl = baseUrl + '?invite=' + encodedString;
            
            const resultBox = document.getElementById('resultBox');
            const resultLink = document.getElementById('resultLink');
            
            resultBox.style.display = 'block';
            resultLink.href = finalUrl;
            resultLink.textContent = finalUrl;
        }


        // Uploading to Cloudinary
        const imageInput = document.getElementById('clientImage');
        const uploadStatus = document.getElementById('uploadStatus');

        // This variable will hold the final cloud URL to attach to your link
        let uploadedImageUrl = ""; 

        imageInput.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            // 1. Show upload progress
            uploadStatus.textContent = "Uploading to cloud... ⏳";
            uploadStatus.style.color = "#ffaa00";

            // 2. Prepare the data for Cloudinary
            const formData = new FormData();
            formData.append('file', file);
            
            // 3. Your specific Cloudinary credentials
            formData.append('upload_preset', 'inbyte_uploads'); 
            const cloudName = 'jg9iv8mc'; 

            try {
                // 4. Send it to Cloudinary via their API
                const response = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.secure_url) {
                    // 5. Success! Save the URL to attach to the invite link
                    uploadedImageUrl = data.secure_url;
                    uploadStatus.textContent = "Upload complete! ✅";
                    uploadStatus.style.color = "#00cc44"; 
                } else {
                    throw new Error("Failed to get URL");
                }
            } catch (error) {
                console.error("Upload error:", error);
                uploadStatus.textContent = "Upload failed. Try again. ❌";
                uploadStatus.style.color = "#ff0000"; 
            }
        });
    </script>
</body>
</html>
