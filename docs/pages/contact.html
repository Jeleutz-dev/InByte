<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | InByte</title>
    <link rel="icon" id="pageIcon" type="image/png" href="../assets/inbyte-icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Go up one folder to access the css folder -->
    <link rel="stylesheet" href="../css/style.css">

    <!-- Anti-Flash Script for Dark Mode -->
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark-mode');
            document.body.classList.add('dark-mode');
        }
    </script>
    
    <!-- Go up one folder to access the js folder -->
    <script src="../js/layout.js" defer></script>

    <style>
        /* Specific styles for the Contact Page */
        .contact-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            text-align: center;
            flex: 1; /* Pushes footer down */
        }

        .contact-container h1 {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .contact-container p {
            font-size: 1.1rem;
            opacity: 0.8;
            margin-bottom: 50px;
            max-width: 500px;
        }

        /* The floating cards wrapper */
        .contact-grid {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 1000px;
        }

        /* Individual Contact Card */
        .contact-card {
            background-color: var(--nav-bg);
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px var(--nav-shadow);
            border-radius: 20px;
            padding: 40px 30px;
            width: 260px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-color);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
        }

        /* The Float Effect! */
        .contact-card:hover {
            transform: translateY(-15px);
            box-shadow: 0 20px 40px rgba(226, 54, 54, 0.15); /* Soft red shadow */
            border-color: var(--primary-color);
        }

        /* Icon Container */
        .icon-wrapper {
            width: 70px;
            height: 70px;
            background-color: rgba(226, 54, 54, 0.1);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            color: var(--primary-color);
            transition: background-color 0.3s ease;
        }

        .contact-card:hover .icon-wrapper {
            background-color: var(--primary-color);
            color: white;
        }

        .icon-wrapper svg {
            width: 32px;
            height: 32px;
            fill: currentColor;
        }

        .contact-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .contact-detail {
            font-size: 1rem;
            opacity: 0.8;
            word-break: break-word;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .contact-container h1 { font-size: 2.2rem; }
            .contact-card { width: 100%; max-width: 300px; padding: 30px 20px; }
        }
    </style>
</head>
