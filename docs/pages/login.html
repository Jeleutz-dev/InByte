<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | InByte</title>
    <link rel="icon" id="pageIcon" type="image/png" href="../assets/inbyte-icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">

    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark-mode');
            document.body.classList.add('dark-mode');
        }
    </script>
    <script src="../js/layout.js" defer></script>

    <style>
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
            padding: 60px 20px;
        }

        .auth-card {
            background-color: var(--nav-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 50px 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 40px var(--nav-shadow);
            text-align: center;
            animation: slideFadeUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .auth-card h1 {
            font-size: 2.2rem;
            margin-top: 0;
            margin-bottom: 10px;
            color: var(--primary-color);
        }

        .auth-card p {
            font-size: 1rem;
            opacity: 0.8;
            margin-bottom: 30px;
        }

        /* --- Custom Google Button adapting to your theme --- */
        .google-auth-btn {
            width: 100%;
            background-color: var(--nav-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s ease;
            margin-top: 10px;
            font-family: 'Poppins', sans-serif;
        }

        .google-auth-btn:hover {
            background-color: var(--hover-bg);
            transform: translateY(-2px);
            border-color: var(--text-color);
        }

        /* Dark Mode sync mirroring your existing step/theme cards */
        .dark-mode .google-auth-btn {
            border-color: rgba(135, 206, 235, 0.3);
        }

        .dark-mode .google-auth-btn:hover {
            border-color: #87CEEB;
            background-color: rgba(135, 206, 235, 0.1);
            box-shadow: 0 10px 20px rgba(135, 206, 235, 0.2);
        }

        @keyframes slideFadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <app-header></app-header>

    <main class="auth-container">
        <div class="auth-card">
            <h1>Welcome!</h1>
            <p>Log in with Google to manage your invitations.</p>

            <button type="button" id="google-login-btn" class="google-auth-btn">
                <svg width="24" height="24" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                Log in with Google
            </button>
        </div>
    </main>

    <app-footer></app-footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

        // IMPORTANT: Replace these with your actual Firebase config keys from Step 2!
        const firebaseConfig = {
        apiKey: "AIzaSyBgBJP3T_-IX68jvkZiUhbpAT076CQAWAQ",
        authDomain: "inbyte-95cd5.firebaseapp.com",
        projectId: "inbyte-95cd5",
        storageBucket: "inbyte-95cd5.firebasestorage.app",
        messagingSenderId: "12505561820",
        appId: "1:12505561820:web:f54fdb68af65a52b1d9219",
        measurementId: "G-3JW84GNH49"

        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const googleLoginBtn = document.getElementById('google-login-btn');
        
        googleLoginBtn.addEventListener('click', () => {
            signInWithPopup(auth, provider)
                .then((result) => {
                    window.location.href = "dashboard.html";
                })
                .catch((error) => {
                    console.error("Error logging in:", error.message);
                    alert("Google Login failed. Please try again.");
                });
        });
    </script>
</body>
</html>
