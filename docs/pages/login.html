<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | InByte</title>
    <link rel="icon" id="pageIcon" type="image/png" href="../assets/inbyte-icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">

    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark-mode');
            document.body.classList.add('dark-mode');
        }
    </script>
    <script src="../js/layout.js" defer></script>

    <style>
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
            padding: 60px 20px;
        }

        .auth-card {
            background-color: var(--nav-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 50px 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 40px var(--nav-shadow);
            text-align: center;
            animation: slideFadeUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .auth-card h1 {
            font-size: 2.2rem;
            margin-top: 0;
            margin-bottom: 10px;
            color: var(--primary-color);
        }

        .auth-card p {
            font-size: 1rem;
            opacity: 0.8;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-color);
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            transition: border-color 0.3s, box-shadow 0.3s;
            box-sizing: border-box;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(226, 54, 54, 0.1);
        }

        .auth-btn {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
            margin-top: 10px;
        }

        .auth-btn:hover {
            background-color: #C62828;
            transform: translateY(-2px);
        }

        .auth-links {
            margin-top: 25px;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
        }

        .auth-links a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .auth-links a:hover {
            text-decoration: underline;
        }

        @keyframes slideFadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <app-header></app-header>

    <main class="auth-container">
        <div class="auth-card">
            <h1>Welcome!</h1>
            <p>Log in to manage your invitations.</p>

            <form action="#" method="POST" id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="hello@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="auth-btn">Log In</button>

                <div class="auth-links">
                    <a href="#">Forgot Password?</a>
                    <a href="#">Create Account</a>
                </div>
            </form>
        </div>
    </main>

    <app-footer></app-footer>

    <script>
        // Placeholder logic to prevent form submission refreshing the page
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert("Backend integration required to process login credentials!");
        });
    </script>
</body>
</html>
